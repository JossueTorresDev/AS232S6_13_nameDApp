name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - develop

env:
  # 👇 Aquí puedes poner el nombre exacto que quieres para tu imagen en Docker Hub
  # Ejemplo: jossuedev/mi-dapp-vallegrande
  IMAGE_NAME: jossuetorres/dapp-onepiece

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Ya no necesitamos permisos especiales porque empujaremos a Docker Hub, no a GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
