<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b21a8;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#9333ea;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.15" />
    </linearGradient>
    <radialGradient id="grad2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#06040a;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Fondo base -->
  <rect width="1920" height="1080" fill="#06040a"/>
  
  <!-- Gradientes de fondo -->
  <rect width="1920" height="1080" fill="url(#grad1)"/>
  <rect width="1920" height="1080" fill="url(#grad2)"/>
  
  <!-- Dragón estilizado (Meliodas) - Forma abstracta -->
  <g transform="translate(960, 350)">
    <!-- Cuerpo principal -->
    <ellipse cx="0" cy="0" rx="280" ry="200" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="3" opacity="0.7"/>
    
    <!-- Cabeza -->
    <circle cx="0" cy="-250" r="120" fill="rgba(245,158,11,0.12)" stroke="#fbbf24" stroke-width="2" opacity="0.8"/>
    
    <!-- Ojo izquierdo -->
    <circle cx="-40" cy="-270" r="20" fill="#f59e0b" opacity="0.9"/>
    <circle cx="-40" cy="-270" r="10" fill="#06040a"/>
    <circle cx="-35" cy="-275" r="4" fill="white" opacity="0.8"/>
    
    <!-- Ojo derecho -->
    <circle cx="40" cy="-270" r="20" fill="#f59e0b" opacity="0.9"/>
    <circle cx="40" cy="-270" r="10" fill="#06040a"/>
    <circle cx="45" cy="-275" r="4" fill="white" opacity="0.8"/>
    
    <!-- Alas izquierda -->
    <path d="M -200 -80 Q -400 -150 -450 0 Q -400 100 -200 60 Z" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <path d="M -200 -80 Q -350 -120 -380 -20" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M -200 -80 Q -350 -80 -380 40" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.5"/>
    
    <!-- Alas derecha -->
    <path d="M 200 -80 Q 400 -150 450 0 Q 400 100 200 60 Z" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <path d="M 200 -80 Q 350 -120 380 -20" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M 200 -80 Q 350 -80 380 40" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.5"/>
    
    <!-- Cola -->
    <path d="M 0 200 Q -120 350 -80 480 Q 0 520 80 480 Q 120 350 0 200" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 0 200 Q 80 300 60 400" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 0 200 Q -80 300 -60 400" stroke="#fbbf24" stroke-width="2" fill="none" opacity="0.5"/>
    
    <!-- Escamas del cuerpo -->
    <circle cx="-80" cy="0" r="40" fill="#f59e0b" opacity="0.15"/>
    <circle cx="80" cy="0" r="40" fill="#f59e0b" opacity="0.15"/>
    <circle cx="0" cy="80" r="35" fill="#f59e0b" opacity="0.12"/>
    <circle cx="-50" cy="50" r="30" fill="#f59e0b" opacity="0.1"/>
    <circle cx="50" cy="50" r="30" fill="#f59e0b" opacity="0.1"/>
    
    <!-- Punto central (corazón del poder) -->
    <circle cx="0" cy="0" r="15" fill="#f59e0b" opacity="0.8"/>
    <circle cx="0" cy="0" r="8" fill="#fbbf24" opacity="0.6"/>
    <circle cx="0" cy="0" r="3" fill="white" opacity="0.9"/>
    
    <!-- Aura de poder -->
    <circle cx="0" cy="0" r="350" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.2" stroke-dasharray="10,5"/>
    <circle cx="0" cy="0" r="320" fill="none" stroke="#9333ea" stroke-width="1" opacity="0.15" stroke-dasharray="8,4"/>
  </g>
  
  <!-- Texto decorativo -->
  <text x="960" y="950" font-family="Cinzel, serif" font-size="56" font-weight="900" fill="#f59e0b" text-anchor="middle" opacity="0.5" letter-spacing="4">
    PALI WALLET
  </text>
  <text x="960" y="1010" font-family="Rajdhani, sans-serif" font-size="20" fill="rgba(245,158,11,0.3)" text-anchor="middle" letter-spacing="2">
    SIETE PECADOS CAPITALES
  </text>
</svg>
